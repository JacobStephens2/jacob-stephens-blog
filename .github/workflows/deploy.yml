name: Deploy jacobstephens.net

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: jacobstephens-net-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Fast-forward production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install the restricted deploy key
        env:
          DEPLOY_KEY: ${{ secrets.JSNET_DEPLOY_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/jacobstephens-net-deploy"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/jacobstephens-net-deploy"
          ssh-keygen -y -f "$HOME/.ssh/jacobstephens-net-deploy" > /dev/null
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          stephens.page ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILhE7HuN3JlkaSZZUPcTnZ1yG+5mOS/6XH9YfWwIpTJe
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy master
        run: |
          ssh \
            -i "$HOME/.ssh/jacobstephens-net-deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            jacob@stephens.page deploy
